name: Process slot claim
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  claim:
    if: contains(github.event.issue.labels.*.name, 'claim-methods') || contains(github.event.issue.labels.*.name, 'claim-readings')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply claim
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const isMethods = context.payload.issue.labels.some(l => l.name === 'claim-methods');
            const file = isMethods ? 'METHODS.md' : 'READINGS.md';
            const body = context.payload.issue.body || '';
            const weekMatch = body.match(/### Week\s*\n\s*\n?(.+)/);
            const nameMatch = body.match(/### Your name\s*\n\s*\n?(.+)/);
            const readingMatch = body.match(/### Reading you are reviewing\s*\n\s*\n?(.+)/);
            const close = async (msg) => {
              await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body: msg});
              await github.rest.issues.update({...context.repo, issue_number: context.issue.number, state: 'closed'});
            };
            if (!weekMatch || !nameMatch) { await close('Could not parse the form; please use the claim template.'); return; }
            if (!isMethods && !readingMatch) { await close('Please state which reading you are reviewing; re-submit using the claim form.'); return; }
            const week = weekMatch[1].trim();
            const name = nameMatch[1].trim().replace(/\|/g, '/');
            const m = week.match(/^(\d\d\/\d\d) (.+)$/);
            if (!m) { await close('Unrecognized week format; please re-submit using the dropdown.'); return; }
            const date = m[1];
            let entry = `${name} (@${context.payload.issue.user.login})`;
            if (!isMethods) entry += ` — ${readingMatch[1].trim().replace(/\|/g, '/')}`;
            execSync('git config user.name "signup-bot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
            // Claims from different issues can race on the push; on rejection, re-read the
            // sheet from origin and re-evaluate, so each attempt works from current state.
            let claimed = null, full = false, found = false;
            for (let attempt = 1; attempt <= 6; attempt++) {
              execSync('git fetch origin main && git reset --hard origin/main');
              claimed = null; full = false; found = false;
              const lines = fs.readFileSync(file, 'utf8').split('\n');
              for (let i = 0; i < lines.length; i++) {
                if (!lines[i].startsWith(`| ${date} `)) continue;
                found = true;
                const cells = lines[i].split('|');
                if (cells[3].trim() === 'OPEN')      { cells[3] = ` ${entry} `; claimed = 'Slot 1'; }
                else if (cells[4].trim() === 'OPEN') { cells[4] = ` ${entry} `; claimed = 'Slot 2'; }
                else { full = true; break; }
                lines[i] = cells.join('|');
                break;
              }
              if (!found || full) break;
              fs.writeFileSync(file, lines.join('\n'));
              execSync(`git add ${file}`);
              execSync(`git commit -m "Claim: ${week} (${isMethods ? 'methods' : 'readings'} ${claimed}) -> ${name}"`);
              try { execSync('git push origin main'); break; }
              catch (e) {
                claimed = null;
                if (attempt === 6) { await close('The sheet is very busy right now; please re-submit your claim in a minute.'); return; }
                execSync(`sleep ${attempt}`);
              }
            }
            if (!found)  { await close('Could not find that week in the sheet; please contact the instructor.'); return; }
            if (full)    { await close(`Sorry — both slots for **${week}** are already taken. Please open a new claim for another week.`); return; }
            if (claimed) { await close(`Confirmed: **${claimed}** for **${week}** is yours, ${name}. See the updated sheet in ${file}.`); }
